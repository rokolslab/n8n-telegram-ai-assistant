<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">n8n Telegram AI Assistant architecture</title>
  <desc id="desc">Telegram message enters preprocessing, chat-action synchronization and command routing, then branches to OpenAI text generation, image generation, or fallback response.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/></marker>
    <style>
      .box{fill:#fff;stroke:#374151;stroke-width:2;rx:14}.ai{fill:#f3f4f6;stroke:#111827;stroke-width:2;rx:14}.tg{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2;rx:14}.fb{fill:#fff7ed;stroke:#9a3412;stroke-width:2;rx:14}.label{font-family:Arial,sans-serif;font-size:18px;fill:#111827;text-anchor:middle;dominant-baseline:middle}.small{font-family:Arial,sans-serif;font-size:14px;fill:#4b5563;text-anchor:middle}.line{stroke:#4b5563;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="640" y="38" style="font-family:Arial,sans-serif;font-size:28px;font-weight:700;fill:#111827;text-anchor:middle">n8n Telegram AI Assistant</text>
  <text x="640" y="66" class="small">Deterministic command routing around OpenAI text and image generation</text>

  <rect class="tg" x="40" y="210" width="150" height="86"/><text class="label" x="115" y="240">Telegram</text><text class="small" x="115" y="268">message update</text>
  <rect class="box" x="235" y="210" width="170" height="86"/><text class="label" x="320" y="240">Normalize</text><text class="small" x="320" y="268">command · prompt · chat</text>
  <rect class="box" x="450" y="210" width="170" height="86"/><text class="label" x="535" y="240">Settings</text><text class="small" x="535" y="268">model + chat action</text>
  <rect class="tg" x="665" y="105" width="165" height="76"/><text class="label" x="747" y="133">Chat Action</text><text class="small" x="747" y="160">typing / upload_photo</text>
  <rect class="box" x="665" y="315" width="165" height="76"/><text class="label" x="747" y="343">Merge</text><text class="small" x="747" y="370">preserve main data</text>
  <rect class="box" x="875" y="210" width="160" height="86"/><text class="label" x="955" y="240">Route Command</text><text class="small" x="955" y="268">Switch</text>

  <rect class="ai" x="1090" y="80" width="150" height="76"/><text class="label" x="1165" y="108">OpenAI Text</text><text class="small" x="1165" y="135">/start</text>
  <rect class="ai" x="1090" y="220" width="150" height="76"/><text class="label" x="1165" y="248">OpenAI Image</text><text class="small" x="1165" y="275">/image</text>
  <rect class="fb" x="1090" y="360" width="150" height="76"/><text class="label" x="1165" y="388">Fallback</text><text class="small" x="1165" y="415">unsupported command</text>

  <path class="line" d="M190 253 H235"/><path class="line" d="M405 253 H450"/>
  <path class="line" d="M620 235 C640 235,640 143,665 143"/><path class="line" d="M620 270 C640 270,640 353,665 353"/><path class="line" d="M747 181 V315"/><path class="line" d="M830 353 C850 353,850 253,875 253"/>
  <path class="line" d="M1035 235 C1060 235,1060 118,1090 118"/><path class="line" d="M1035 253 H1090"/><path class="line" d="M1035 272 C1060 272,1060 398,1090 398"/>
</svg>
